name: Maintain Prefix controller image

on:
  push:
    branches: [images/maintained-prefix]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: maintained-prefix-image
  cancel-in-progress: false

jobs:
  verify-and-sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      upstream: ${{ steps.source.outputs.upstream }}
      version: ${{ steps.source.outputs.version }}
      image: ${{ steps.source.outputs.image }}
    env:
      KUBECONFIG: /dev/null
      USE_EXISTING_CLUSTER: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: images/maintained-prefix
          fetch-depth: 0
      - name: Merge upstream without overriding local changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch https://github.com/STRRL/cloudflare-tunnel-ingress-controller.git master
          upstream=$(git rev-parse FETCH_HEAD)
          if ! git merge --no-edit "$upstream"; then
            git merge --abort
            echo 'Upstream merge conflicted. The maintained branch and published tags are unchanged.' >&2
            exit 1
          fi
          echo "$upstream" > "$RUNNER_TEMP/upstream-revision"
          version=$(gh api repos/STRRL/cloudflare-tunnel-ingress-controller/releases/latest --jq .tag_name)
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "$version" > "$RUNNER_TEMP/upstream-version"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify Prefix regression coverage and unit tests
        run: |
          set -euo pipefail
          test -z "$(gofmt -l pkg/controller/ingress_path_test.go pkg/controller/transform.go pkg/exposure/exposure.go)"
          go test -list '^TestFromIngressToExposurePathMatching$' ./pkg/controller | grep -Fx TestFromIngressToExposurePathMatching
          CGO_ENABLED=1 go test -race ./pkg/...
          go vet ./...
      - name: Verify against a local Kubernetes API server
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v1.36.2/envtest-v1.36.2-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/envtest.tar.gz"
          echo "5e99f4eef3d6f9d4dd063730299f708c98da8801f2f14d8fc762cb354f30c332  $RUNNER_TEMP/envtest.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/envtest.tar.gz" -C "$RUNNER_TEMP"
          export KUBEBUILDER_ASSETS="$RUNNER_TEMP/controller-tools/envtest"
          CGO_ENABLED=1 go test -race ./test/integration/...
      - name: Publish the verified source revision
        id: source
        run: |
          set -euo pipefail
          git push origin HEAD:images/maintained-prefix
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "upstream=$(cat "$RUNNER_TEMP/upstream-revision")" >> "$GITHUB_OUTPUT"
          echo "version=$(cat "$RUNNER_TEMP/upstream-version")" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cloudflare-tunnel-ingress-controller" >> "$GITHUB_OUTPUT"

  build:
    needs: verify-and-sync
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-and-sync.outputs.revision }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: image/cloudflare-tunnel-ingress-controller/Dockerfile
          platforms: linux/${{ matrix.arch }}
          pull: true
          push: true
          tags: ${{ needs.verify-and-sync.outputs.image }}:sha-${{ needs.verify-and-sync.outputs.revision }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify-and-sync.outputs.revision }}
            org.opencontainers.image.version=${{ needs.verify-and-sync.outputs.version }}-prefix
            io.colah16.upstream.revision=${{ needs.verify-and-sync.outputs.upstream }}
          cache-from: type=gha,scope=maintained-prefix-${{ matrix.arch }}
          cache-to: type=gha,scope=maintained-prefix-${{ matrix.arch }},mode=max

  publish:
    needs: [verify-and-sync, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned and latest multi-architecture tags
        env:
          IMAGE: ${{ needs.verify-and-sync.outputs.image }}
          REVISION: ${{ needs.verify-and-sync.outputs.revision }}
          VERSION: ${{ needs.verify-and-sync.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:sha-$REVISION" \
            --tag "$IMAGE:$VERSION-prefix-${REVISION:0:12}" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            "$IMAGE:sha-$REVISION-amd64" "$IMAGE:sha-$REVISION-arm64"
          docker buildx imagetools inspect "$IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
