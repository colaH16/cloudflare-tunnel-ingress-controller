apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pr368-path-matching
  namespace: pr368-path-test
spec:
  ingressClassName: cf-pr368-path-test
  rules:
  - host: test.example.com
    http:
      paths:
      - path: /wp-admin/
        pathType: Prefix
        backend:
          service:
            name: admin-echo
            port:
              number: 80
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: admin-echo
            port:
              number: 80
      - path: /v1.0
        pathType: Prefix
        backend:
          service:
            name: literal-echo
            port:
              number: 80
      - path: /legacy/(admin|login)$
        pathType: ImplementationSpecific
        backend:
          service:
            name: admin-echo
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: public-echo
            port:
              number: 80
